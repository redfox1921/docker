services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vault.example.com"   # deine echte HTTPS-URL
      SIGNUPS_ALLOWED: "true"               # nach dem Anlegen deines Accounts auf "false"
      INVITATIONS_ALLOWED: "false"
      SHOW_PASSWORD_HINT: "false"
      # Argon2-Hash einsetzen, jedes $ als $$ schreiben:
      ADMIN_TOKEN: '$$argon2id$$v=19$$m=65540,t=3,p=4$$HIER_DEINEN_HASH_EINSETZEN'
      LOG_LEVEL: "warn"
      TZ: "Europe/Berlin"
    volumes:
      - ./vw-data:/data
    ports:
      - "8081:80"
    networks:
      - npm-net

networks:
  npm-net:
    external: true
